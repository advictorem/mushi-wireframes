:root
  --cherry-dark:#630B0B; --cherry:#8F0909; --cherry-t1:#E49C9C; --cherry-t2:#FFD1D1;
  --peach-dark:#B23508; --peach:#F17847; --peach-t1:#F4B8A6; --peach-t2:#F1DDCC;
  --apple-dark:#384133; --apple:#397218; --apple-t1:#A1C669; --apple-t2:#DCE4D0;
  --sage:#A7C1B2; --cream:#FBF7F0; --ink:#2E1A10;
  --font-display:"Magnilo Display","PT Serif",Georgia,serif;
  --font-body:"PT Serif",Georgia,serif;
  --font-mono:"PT Mono",Menlo,monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{font-family:var(--font-body);color:var(--ink);background:var(--cream);-webkit-font-smoothing:antialiased;}
img{display:block;max-width:100%;}
.wrap{max-width:1280px;margin:0 auto;padding:0 48px;}
section{padding:110px 0;}
.display{font-family:var(--font-display);font-weight:400;font-size:clamp(44px,6.5vw,88px);line-height:1;}
.h2{font-family:var(--font-display);font-weight:400;font-size:clamp(32px,4.2vw,56px);line-height:1.05;}
.h3{font-family:var(--font-display);font-weight:400;font-size:clamp(22px,2.6vw,32px);line-height:1.15;}
.eyebrow{font-family:var(--font-mono);font-size:11px;letter-spacing:.25em;text-transform:uppercase;}
.body-copy{font-size:16px;line-height:1.7;max-width:52ch;}
.center{text-align:center;margin-left:auto;margin-right:auto;}
.btn{
  display:inline-block;padding:15px 34px;border-radius:999px;cursor:pointer;text-decoration:none;
  font-weight:700;font-family:var(--font-mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  border:1.5px solid var(--ink);color:var(--ink);background:transparent;transition:.2s;
}
.btn.solid{background:var(--peach);border-color:var(--peach);color:#fff;}
.btn.solid:hover{background:var(--peach-dark);border-color:var(--peach-dark);}
.btn:hover{transform:translateY(-2px);}
/* ---------- announcement ---------- */
.announce{
  position:fixed;top:0;left:0;right:0;height:42px;z-index:120;
  background:var(--sage);color:var(--apple-dark);display:flex;align-items:center;padding:0;
  font-family:var(--font-mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;
}
.ticker{flex:1;height:100%;overflow:hidden;display:flex;align-items:center;min-width:0;}
.ticker-track{display:flex;align-items:center;white-space:nowrap;will-change:transform;animation:tick 60s linear infinite;}
.ticker-track span{display:flex;align-items:center;gap:34px;padding-right:34px;}
.ticker-track svg{width:13px;height:13px;fill:currentColor;flex:0 0 auto;}
@keyframes tick{to{transform:translateX(-50%);}}
.announce .a-close{
  cursor:pointer;font-size:11px;letter-spacing:.14em;display:flex;align-items:center;gap:8px;
  position:relative;z-index:2;background:var(--sage);height:100%;padding:0 20px;
  box-shadow:-14px 0 14px var(--sage);
}
.announce .a-close b{font-size:23px;font-weight:400;line-height:1;}
.announce .a-close:hover{opacity:.7;}
body.no-promo .announce{display:none;}
/* ---------- frosted nav ---------- */
nav.floating{
  position:fixed;top:84px;left:50%;transform:translateX(-50%);
  width:min(1180px,calc(100% - 48px));
  background:rgba(255,250,243,.55);
